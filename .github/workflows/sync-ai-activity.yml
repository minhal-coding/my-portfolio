name: Sync AI activity

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-activity-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh public project activity
        run: node scripts/sync-ai-activity.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GROWTH_AI_REPOSITORY: ${{ vars.GROWTH_AI_REPOSITORY }}
          CODEX_TOKEN_TOTAL: ${{ vars.CODEX_TOKEN_TOTAL }}

      - name: Publish changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/ai-activity.json; then
            echo "No activity changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-activity.json
          git commit -m "chore: refresh AI activity snapshot"
          git push
