name: Validate portfolio scripts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/sync-ai-activity.test.mjs
      - run: node --check app.js && node --check activity.js
